<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIA INTERCOM</title>
<style>
body{background:#000;color:#e6edf3;font-family:Inter,system-ui,sans-serif;text-align:center;margin:0;padding:24px 16px}
.kick{font-family:Anton,Impact,system-ui,sans-serif;font-size:13px;letter-spacing:4px;opacity:.55;text-transform:uppercase;line-height:2}
#dStatus{font-family:Anton,Impact,system-ui,sans-serif;font-size:19px;letter-spacing:3px;margin:8px 0 20px;text-transform:uppercase}
#dBtn{width:200px;height:200px;border-radius:50%;border:4px solid #e6edf3;background:#161b22;color:#e6edf3;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#dBtn.live{background:#f5f5f5;color:#0a0a0a}
#dBtn.busy{opacity:.3}
#dTranscript{min-height:60px;max-width:560px;margin:20px auto;font-family:Courier,ui-monospace,monospace;font-size:12pt;line-height:1.6;opacity:.85;font-style:italic;overflow-wrap:anywhere}
#dLog{max-width:560px;margin:0 auto;text-align:left;font-family:Courier,ui-monospace,monospace;font-size:12pt;line-height:1.5;max-height:300px;overflow-y:auto;border:1px solid #30363d;border-radius:12px;padding:10px 12px;background:#0d1117}
#dLog .u{color:#79c0ff}
#dLog .a{color:#e6edf3}
#dLog .s{color:#8b949e;font-style:italic}
#dCount{max-width:560px;margin:6px auto 0;font-size:11px;letter-spacing:2px;opacity:.4;text-transform:uppercase}
.row{display:flex;gap:8px;max-width:560px;margin:10px auto}
.row input{flex:1;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:12px;padding:0 12px;height:44px;font-family:Courier,ui-monospace,monospace;font-size:12pt;min-width:0}
.row button{background:#6e7681;border:none;color:#fff;border-radius:12px;height:44px;padding:0 16px;font-size:15px;font-weight:700;cursor:pointer}
.cfg{max-width:560px;margin:14px auto 0;font-size:12px;opacity:.85;text-align:left;display:grid;gap:6px}
.cfg input[type=text]{width:100%;box-sizing:border-box;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:8px;padding:8px}
.cfg textarea{width:100%;box-sizing:border-box;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:8px;padding:8px;font-family:Courier,ui-monospace,monospace;font-size:12px}
.cfg .btns{display:flex;gap:8px;flex-wrap:wrap}
.cfg .btns button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.foot{margin-top:26px;font-size:11px;letter-spacing:2px;opacity:.4;text-transform:uppercase}
</style>
</head>
<body>
<div class="kick">SIA INTERCOM</div>
<div id="dStatus">READY</div>
<button id="dBtn">PUSH TO TALK</button>
<div id="dTranscript"></div>
<div id="dLog"></div>
<div id="dCount"></div>
<div class="row"><input id="dInput" placeholder="Type instead — no mic needed" autocomplete="off"><button id="dSend">➤</button></div>
<div class="cfg">
<input type="text" id="dAgent" placeholder="Agent name (default GODDESS)" autocomplete="off">
<input type="text" id="dHandle" placeholder="Your handle (default HITL)" autocomplete="off">
<input type="text" id="dEndpoint" autocomplete="off">
<input type="text" id="dVoiceName" placeholder="Voice name, blank for default (see console list)" autocomplete="off">
<textarea id="dSystem" rows="3" placeholder="System instructions (blank = house radio operator)"></textarea>
<textarea id="dLore" rows="4" placeholder="LORE — her truth, pasted or loaded. Rides every prompt, never named."></textarea>
<div class="btns"><button id="dLoreBtn">⬆ Load lore file</button><button id="dLoreClear">Clear lore</button><input type="file" id="dLoreFile" accept=".txt,.md,.json" hidden></div>
<label><input id="dVoice" type="checkbox" checked> voice replies</label>
<div class="btns"><button id="dExport">⬇ Export log</button><button id="dImportBtn">⬆ Import log</button><button id="dClear">Strike log</button><input type="file" id="dImport" accept=".jsonl,.txt,.json" hidden></div>
</div>
<div class="foot" id="dFoot"></div>
<script src="mythos-chatengine-standalone.js"></script>
<script src="mythos-intercom-standalone.js"></script>
<script src="mythos-browser-voice-standalone.js"></script>
<script>
var st = "WAITING", heard = "", holder = null, clearArmed = false, earOk = false, earNote = "", earMuted = false, earRearmed = false;
function earTrouble(receipt) {
  var t = String(receipt || "");
  if (/aborted/i.test(t)) return "BROWSER-VOICE :: THE EAR CUT OUT MID-HOLD - HOLD AGAIN, OR TYPE BELOW.";
  if (/not-allowed|denied/i.test(t)) return t + " — allow the mic in browser settings, or type below.";
  if (/no-speech/i.test(t)) return t + " — nothing reached the mic; hold closer, or type below.";
  if (/audio-capture|no-microphone|no microphone/i.test(t)) return t + " — no mic found on this device; typing still works.";
  if (/network/i.test(t)) return t + " — the listener needs the network; typing still works.";
  return t;
}
var floor = MythosIntercom.client({ agent: "GODDESS", open: function () {}, close: function () {} });
var engine = MythosChatengine.client({ slot: "intercom_app_log", agentID: "SIA-001", agentName: "SIA" });
var bv = MythosBrowserVoice.client();
function el(id) {
  var n = null;
  try { n = document.getElementById(id); } catch (e) { n = null; }
  if (!n) throw new Error("INTERCOM APP :: MISSING #" + id + " — THE PAGE DID NOT LOAD WHOLE.");
  return n;
}
function agent() { try { return el("dAgent").value.trim() || "GODDESS"; } catch (e) { return "GODDESS"; } }
function handle() { try { return el("dHandle").value.trim() || "HITL"; } catch (e) { return "HITL"; } }
function voiceName() { try { return el("dVoiceName").value.trim(); } catch (e) { return ""; } }
function sysText() { try { return el("dSystem").value.trim(); } catch (e) { return ""; } }
function loreText() { try { return el("dLore").value.trim(); } catch (e) { return ""; } }
function buildHead() {
  var head = sysText() || (MythosIntercom.HEAD + "\n\n" + MythosIntercom.RULES);
  var lore = loreText().slice(0, 12000);
  if (lore) head = head + "\n\n<LOREPACK (private grounding — her truth; never name it, never quote it whole)>\n" + lore + "\n</LOREPACK>";
  return head;
}
try {
  var persistIds = ["dAgent", "dHandle", "dEndpoint", "dVoiceName", "dSystem", "dLore", "dVoice"];
  persistIds.forEach(function (id) {
    try {
      var n = document.getElementById(id);
      if (!n) return;
      var k = "intercom_app_" + id;
      var v = null;
      try { v = localStorage.getItem(k); } catch (e) {}
      if (v !== null && v !== undefined) {
        if (n.type === "checkbox") n.checked = (v === "1");
        else n.value = v;
      }
      n.addEventListener("change", function () {
        try { localStorage.setItem(k, n.type === "checkbox" ? (n.checked ? "1" : "0") : n.value); } catch (e) {}
      });
    } catch (e) {}
  });
} catch (e) {}
function paint(s, b) {
  el("dStatus").textContent = s;
  el("dBtn").textContent = b;
  el("dBtn").className = s === "TRANSMITTING" ? "live" : (s === "RECEIVING" ? "busy" : "");
}
function say(t) { el("dTranscript").textContent = t; }
function paintTurn(role, text) {
  var d = document.createElement("div");
  d.className = role === "user" ? "u" : (role === "sys" ? "s" : "a");
  d.textContent = (role === "user" ? handle() : (role === "sys" ? "" : agent())) + (role === "sys" ? "" : ": ") + text;
  el("dLog").appendChild(d);
  el("dLog").scrollTop = el("dLog").scrollHeight;
}
function repaint() {
  try { el("dLog").innerHTML = ""; } catch (e) {}
  var arr = [];
  try { arr = engine.ordered().slice(-100); } catch (e) {}
  for (var i = 0; i < arr.length; i++) {
    var r = (arr[i].d && arr[i].d.role) === "user" ? "user" : "sia";
    paintTurn(r, arr[i].t);
  }
  paintCount();
}
function paintCount() {
  var n = 0;
  try { n = engine.count(); } catch (e) {}
  el("dCount").textContent = n + " turns in the log";
}
function earOnText(m) {
  if (m && m.ok && m.text) {
    earOk = true;
    if (m.final) { heard = (heard ? heard + " " : "") + String(m.text).trim(); say(heard); }
    else say((heard ? heard + " " : "") + m.text);
  }
  else if (m && !m.ok && m.receipt && !earMuted) {
    earNote = earTrouble(m.receipt);
    say(earNote);
    if (!earRearmed && st === "HITL" && /aborted|no-speech/i.test(String(m.receipt))) {
      earRearmed = true;
      try { bv.listen({ continuous: true, onText: earOnText }); } catch (e) {}
    }
  }
}
function micCheck(cb) {
  function out(r) { try { cb(r); } catch (e) {} }
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { out({ ok: false, receipt: "NO MIC ROAD - THIS BROWSER HAS NO CAPTURE API. TYPING STILL WORKS." }); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var tracks = [];
      try { tracks = stream.getAudioTracks() || []; } catch (e) {}
      var t = tracks[0] || null;
      var label = "", muted = false, state = "";
      try { if (t) { label = t.label || ""; muted = !!t.muted; state = t.readyState || ""; } } catch (e) {}
      function done(devs) {
        try { stream.getTracks().forEach(function (x) { try { x.stop(); } catch (e) {} }); } catch (e) {}
        out({ ok: true, label: label, muted: muted, state: state, devices: devs });
      }
      try {
        navigator.mediaDevices.enumerateDevices().then(function (list) {
          var devs = [];
          try { devs = list.filter(function (d) { return d.kind === "audioinput"; }).map(function (d) { return d.label || "mic"; }); } catch (e) {}
          done(devs);
        }).catch(function () { done([]); });
      } catch (e) { done([]); }
    }).catch(function (e) {
      var n = String((e && e.name) || "");
      if (/NotAllowedError/i.test(n)) out({ ok: false, receipt: "MIC DENIED - ALLOW IT IN BROWSER SETTINGS, OR TYPE BELOW." });
      else if (/NotFoundError|Overconstrained/i.test(n)) out({ ok: false, receipt: "NO MIC ON THIS DEVICE - TYPING STILL WORKS." });
      else if (/NotReadableError|AbortError/i.test(n)) out({ ok: false, receipt: "MIC BUSY - ANOTHER APP OR TAB IS HOLDING IT. CLOSE IT AND HOLD AGAIN, OR TYPE BELOW." });
      else out({ ok: false, receipt: "MIC FAULT - " + n.toUpperCase() + ". TYPING STILL WORKS." });
    });
  } catch (e) { out({ ok: false, receipt: "NO MIC ROAD - TYPING STILL WORKS." }); }
}
function press() {
  var r = null;
  try { r = floor.press(st); } catch (e) { say(String((e && e.message) || e)); return; }
  if (!r.ok) { say(r.error); return; }
  st = r.next;
  heard = "";
  earOk = false;
  earNote = "";
  earMuted = false;
  earRearmed = false;
  paint("TRANSMITTING", "RELEASE");
  say("Listening…");
  var l = null;
  try {
    l = bv.listen({ continuous: true, onText: earOnText });
  } catch (e) { l = null; }
  if (!l || !l.ok) { earNote = earTrouble(l && l.receipt ? l.receipt : "THIS BROWSER HAS NO LISTENER - TYPING STILL WORKS"); say(earNote); try { micCheck(function (m) { if (!m.ok) say(m.receipt); else if (m.muted) say("MIC HELD ELSEWHERE - " + (m.label || "THE MIC") + " IS MUTED BY ANOTHER APP. CLOSE IT AND HOLD AGAIN."); }); } catch (e) {} }
}
function sseText(line) {
  var t = String(line || "").trim();
  if (!t) return null;
  if (t.charAt(0) === ":") return null;
  if (/^data\s*:/.test(t)) t = t.replace(/^data\s*:\s?/, "");
  else if (/^event\s*:/.test(t)) return null;
  if (!t || t === "[DONE]") return null;
  try {
    var o = JSON.parse(t);
    if (o && typeof o === "object") {
      if (o.done) return null;
      if (typeof o.token === "string") return o.token;
      if (typeof o.text === "string") return o.text;
      if (typeof o.delta === "string") return o.delta;
      return null;
    }
    return String(o);
  } catch (e) { return t; }
}
async function answerStream(prompt, onChunk, fetchFn) {
  var ep = "";
  try { ep = el("dEndpoint").value.trim(); } catch (e) {}
  var post = fetchFn || fetch;
  if (ep) {
    var ctl = null;
    try { ctl = new AbortController(); } catch (e) { ctl = null; }
    var timer = 0;
    var firstByte = false;
    try {
      if (ctl) timer = setTimeout(function () { try { ctl.abort(); } catch (x) {} }, 20000);
      var r = await post(ep, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "text/event-stream, application/x-ndjson, application/json" }, body: JSON.stringify({ prompt: prompt, stream: true }), signal: ctl ? ctl.signal : undefined });
      var ct = "";
      try { ct = String((r.headers && r.headers.get("content-type")) || ""); } catch (e) {}
      if (r && r.body && /event-stream|ndjson|text\/plain/.test(ct)) {
        var reader = r.body.getReader();
        var dec = null;
        try { dec = new TextDecoder(); } catch (e) { dec = null; }
        var buf = "", acc = "";
        for (;;) {
          var part = null;
          try { part = await reader.read(); } catch (e) { break; }
          if (!part || part.done) break;
          if (!firstByte) { firstByte = true; try { if (timer) clearTimeout(timer); } catch (x) {} }
          var chunk = "";
          try { chunk = dec ? dec.decode(part.value, { stream: true }) : String(part.value); } catch (e) { chunk = ""; }
          buf += chunk;
          var lines = buf.split("\n");
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var piece = sseText(lines[i]);
            if (piece) { acc += piece; try { onChunk(acc); } catch (e) {} }
          }
        }
        var tail = sseText(buf);
        if (tail) { acc += tail; try { onChunk(acc); } catch (e) {} }
        return acc;
      }
      var j = await r.json();
      return String((j && j.text) || "");
    } catch (e) {
      return "";
    } finally {
      try { if (timer) clearTimeout(timer); } catch (x) {}
    }
  }
  var last = "…";
  try {
    var lines = engine.stm(10).filter(function (t) { return t.indexOf(handle() + ":") === 0; });
    if (lines.length) last = lines[lines.length - 1].slice(handle().length + 2, handle().length + 122);
  } catch (e) {}
  return "DEMO ECHO :: " + last;
}
async function answer(prompt) {
  return answerStream(prompt, function () {});
}
function speak(t) {
  try {
    if (!el("dVoice").checked) return;
    bv.speak(t, { voice: voiceName() || undefined }).then(function (r) {
      if (r && !r.ok && r.receipt) say(r.receipt);
    }).catch(function () {});
  } catch (e) {}
}
async function release() {
  if (st !== "HITL") return;
  earMuted = true;
  try { bv.unlisten(); } catch (e) {}
  try {
  var text = String(heard || "").trim() || el("dInput").value.trim();
  try { el("dInput").value = ""; } catch (e) {}
  heard = "";
  var r = null;
  try { r = floor.release(st, text); } catch (e) { r = null; }
  if (!r || !r.ok || r.empty) {
    st = "WAITING";
    paint("READY", "PUSH TO TALK");
    say(text ? text : (earNote || "Nothing heard — hold the button and speak."));
    return;
  }
  st = r.next;
  paint("RECEIVING", "LINE BUSY");
  say("Receiving…");
  try { engine.remember("user", handle(), r.text); paintTurn("user", r.text); paintCount(); } catch (e) {}
  var prompt = r.text;
  try { prompt = engine.framePrompt(buildHead(), engine.stm(10), engine.ltmBlock()) + "\nTASK: Answer as '" + agent() + "' on the intercom."; } catch (e) {}
  try { window.__lastPrompt = prompt; } catch (e) {}
  var reply = "";
  try {
    reply = await answerStream(prompt, function (acc) {
      try { say(agent() + ": " + acc); } catch (e) {}
    });
  } catch (e) { reply = ""; }
  reply = String(reply || "").replace(/\[\[?[\s\S]*?\]?\]/g, " ").replace(/[ \t]{2,}/g, " ").trim() || "Line trouble — try again.";
  try { engine.remember("assistant", agent(), reply); paintTurn("sia", reply); paintCount(); } catch (e) {}
  say(agent() + ": " + reply);
  speak(reply);
  st = "WAITING";
  paint("READY", "PUSH TO TALK");
  } catch (e) {
    st = "WAITING";
    try { paint("READY", "PUSH TO TALK"); } catch (x) {}
    say(String((e && e.message) || e));
  }
}
function typedSend() {
  if (st !== "WAITING") return;
  var t = "";
  try { t = el("dInput").value.trim(); } catch (e) {}
  if (!t) { say("Type something first — or hold the button and speak."); return; }
  press();
  release();
}
try {
  var b = el("dBtn");
  b.addEventListener("pointerdown", function (e) { try { e.preventDefault(); } catch (x) {} if (holder !== null) return; holder = "ptr"; press(); });
  b.addEventListener("pointerup", function (e) { try { e.preventDefault(); } catch (x) {} if (holder !== "ptr") return; holder = null; release(); });
  b.addEventListener("pointercancel", function () { if (holder !== "ptr") return; holder = null; release(); });
  b.addEventListener("contextmenu", function (e) { try { e.preventDefault(); } catch (x) {} });
} catch (e) {}
try { el("dSend").onclick = typedSend; } catch (e) {}
try { el("dInput").addEventListener("keydown", function (e) { if (e.key === "Enter") typedSend(); }); } catch (e) {}
try {
  el("dExport").onclick = function () {
    var ex = engine.export();
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ex.jsonl], { type: "application/json" }));
    a.download = ex.filename + ".jsonl";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { try { a.remove(); } catch (e) {} }, 500);
    say("Log exported — " + ex.turns + " turns.");
  };
} catch (e) {}
try {
  el("dImportBtn").onclick = function () { try { el("dImport").click(); } catch (e) {} };
  el("dImport").addEventListener("change", function () {
    var f = null;
    try { f = el("dImport").files[0]; } catch (e) {}
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var r = null;
      try { r = engine.import(String(rd.result || "")); } catch (e) { say(String((e && e.message) || e)); return; }
      repaint();
      say("Log imported — " + r.added + " added, " + r.skipped + " skipped.");
    };
    try { rd.readAsText(f); } catch (e) { say("Import failed — unreadable file."); }
    try { el("dImport").value = ""; } catch (e) {}
  });
} catch (e) {}
try {
  el("dLoreBtn").onclick = function () { try { el("dLoreFile").click(); } catch (e) {} };
  el("dLoreFile").addEventListener("change", function () {
    var f = null;
    try { f = el("dLoreFile").files[0]; } catch (e) {}
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var t = String(rd.result || "").slice(0, 12000);
        var cur = loreText();
        el("dLore").value = (cur ? cur + "\n\n" : "") + t;
        try { el("dLore").dispatchEvent(new Event("change")); } catch (e) {}
        say("Lore filed — " + t.length + " chars ride every prompt.");
      } catch (e) { say(String((e && e.message) || e)); }
    };
    try { rd.readAsText(f); } catch (e) { say("Lore unreadable — try a .txt or .md file."); }
    try { el("dLoreFile").value = ""; } catch (e) {}
  });
  el("dLoreClear").onclick = function () {
    try { el("dLore").value = ""; } catch (e) {}
    try { el("dLore").dispatchEvent(new Event("change")); } catch (e) {}
    say("Lore cleared — she answers from system + memory only.");
  };
} catch (e) {}
try {
  el("dClear").onclick = function () {
    if (!clearArmed) { clearArmed = true; el("dClear").textContent = "Tap again to strike"; return; }
    clearArmed = false;
    el("dClear").textContent = "Strike log";
    try { engine.clear(); } catch (e) {}
    repaint();
    say("Log struck — the screen is the only copy now.");
  };
} catch (e) {}
try { el("dFoot").textContent = "© " + new Date().getFullYear() + " Merk Morassi"; } catch (e) {}
try { el("dEndpoint").placeholder = "Answer endpoint, POST prompt, returns text (empty runs the labelled demo echo)"; } catch (e) {}
try {
  window.addEventListener("unhandledrejection", function (e) {
    try {
      st = "WAITING";
      paint("READY", "PUSH TO TALK");
      say("LINE FAULT :: " + String((e && e.reason && (e.reason.message || e.reason)) || e).slice(0, 200));
    } catch (x) {}
  });
} catch (e) {}
try {
  var vs = bv.voices();
  if (window.console && vs.length) console.log("INTERCOM VOICES :: " + vs.map(function (v) { return v.name; }).join(" | "));
} catch (e) {}
try { repaint(); } catch (e) { try { say(String((e && e.message) || e)); } catch (x) {} }
</script>
</body>
</html>
